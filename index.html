<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care Hours</title>
<meta name="description" content="A simple time clock for caregivers. Clock in and out, add missed shifts, and see your weekly hours.">
<meta name="theme-color" content="#1E7369">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Care Hours">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Care Hours</h1>
    <div class="today" id="today"></div>
  </header>

  <div class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" id="tabMine" aria-selected="true">Shifts</button>
    <button role="tab" id="tabPlan" aria-selected="false">Schedule</button>
    <button role="tab" id="tabShared" aria-selected="false">Caregivers</button>
  </div>

  <section class="sharedhead" id="sharedHead" hidden>
    <div class="rowline">
      <span class="label" id="sharedLabel">Hours shared with you</span>
      <span class="readonly">View only</span>
    </div>
    <div class="field" id="ownerPickWrap">
      <label class="label" for="ownerPick">Caregiver</label>
      <select id="ownerPick"></select>
    </div>
    <div id="sharedWho"></div>
    <div class="rowline">
      <span class="hint" id="sharedUpdated"></span>
      <button class="ghost" id="sharedRefresh">Refresh</button>
    </div>
  </section>

  <section class="clock" id="clock" aria-live="polite"></section>

  <section class="week" aria-label="Weekly hours">
    <div class="weekhead">
      <h2 id="weekTitle">This week</h2>
      <div class="nav">
        <button class="ghost" id="prevWeek" aria-label="Previous week">‹</button>
        <button class="ghost" id="thisWeek" hidden>Today</button>
        <button class="ghost" id="nextWeek" aria-label="Next week">›</button>
      </div>
    </div>
    <div class="total"><b class="num" id="weekTotal">0h</b><span id="weekDecimal">0.00 hours</span></div>
    <div class="vs" id="weekVs" hidden></div>
    <div class="bars" id="bars"></div>
    <div class="bycg" id="byCaregiver" hidden></div>
  </section>

  <section class="plan" id="plan" hidden>
    <div class="loghead">
      <h2>Schedule</h2>
      <div class="tools">
        <button class="ghost" data-new="weekly">+ Repeating shift</button>
        <button class="ghost" data-new="once">+ One-time shift</button>
        <button class="ghost" data-new="off">+ Time off</button>
      </div>
    </div>
    <div id="planForm"></div>
    <div id="planList"></div>
  </section>

  <section class="plan" id="planShared" hidden></section>

  <section class="log" id="logSection">
    <div class="loghead">
      <h2>Shifts</h2>
      <div class="tools">
        <button class="ghost" id="addBtn">+ Add a missed shift</button>
        <button class="ghost" id="csvBtn">Download week (CSV)</button>
      </div>
    </div>
    <div id="formSlot"></div>
    <div id="list"></div>
  </section>

  <section class="sync" id="sync" aria-live="polite" hidden></section>

  <aside class="install" id="installTip" hidden>
    <span class="label">Use it like an app</span>
    <p>On iPhone, tap the Share button in Safari, then <b>Add to Home Screen</b>. Care Hours then opens full screen from its own icon and keeps your shifts safe on this phone.</p>
  </aside>

  <p class="foot" id="foot">Loading your shifts…</p>
</div>

<datalist id="people"></datalist>

<!-- App code, in load order -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.3"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/schedule.js"></script>
<script src="js/storage.js"></script>
<script src="js/sharing.js"></script>
<script src="js/shifts-view.js"></script>
<script src="js/schedule-view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
