<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care Hours</title>
<meta name="description" content="A simple time clock for caregivers. Clock in and out, add missed shifts, and see your weekly hours.">
<meta name="theme-color" content="#1E7369">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Care Hours">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-first column. The clock card is the single emphasized object; the week strip and the day-by-day log sit quietly below it. */
:root {
  --bg: #F2F6F5;
  --surface: #FFFFFF;
  --ink: #16302F;
  --muted: #586E6B;
  --line: #D6E1DE;
  --accent: #1E7369;
  --accent-ink: #FFFFFF;
  --live: #B9620F;
  --live-soft: #FCEEDD;
  --danger: #B3261E;
  --bar: #BCD7D1;
  --bar-today: #1E7369;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1918; --surface: #162523; --ink: #E3EDEB; --muted: #92A7A3; --line: #29403C;
    --accent: #52B5A7; --accent-ink: #052019; --live: #F2A651; --live-soft: #3A2814;
    --danger: #F2877F; --bar: #2B524C; --bar-today: #52B5A7; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1918; --surface: #162523; --ink: #E3EDEB; --muted: #92A7A3; --line: #29403C;
  --accent: #52B5A7; --accent-ink: #052019; --live: #F2A651; --live-soft: #3A2814;
  --danger: #F2877F; --bar: #2B524C; --bar-today: #52B5A7; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; -webkit-text-size-adjust: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.today { color: var(--muted); font-size: 0.95rem; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
textarea { resize: vertical; min-height: 64px; }

/* Clock card */
.clock {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 20px; display: flex; flex-direction: column; gap: 16px;
}
.clock.on { border-color: var(--live); box-shadow: 0 0 0 3px var(--live-soft); }
.status { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.on .dot { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
.on .status { color: var(--live); }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .on .dot { animation: none; } }
.timer { font-family: var(--mono); font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.since { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.big {
  border: 0; border-radius: 14px; min-height: 58px; font-size: 1.15rem; font-weight: 700;
  background: var(--accent); color: var(--accent-ink);
}
.big.out { background: var(--live); color: var(--surface); }
.big:active { transform: translateY(1px); }

/* Week */
.week { display: flex; flex-direction: column; gap: 14px; }
.weekhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav { display: flex; gap: 6px; }
.ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 12px; min-height: 40px; min-width: 40px;
}
.ghost:hover { border-color: var(--accent); }
.total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.total b { font-family: var(--display); font-size: 2.2rem; line-height: 1; }
.total span { color: var(--muted); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.track { width: 100%; height: 72px; display: flex; align-items: flex-end; background: var(--bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.fill { width: 100%; background: var(--bar); border-radius: 6px 6px 0 0; }
.day.is-today .fill { background: var(--bar-today); }
.day.is-today .dname { color: var(--ink); font-weight: 700; }
.dname { font-size: 0.75rem; color: var(--muted); }
.dhrs { font-size: 0.8rem; font-variant-numeric: tabular-nums; }

/* Log */
.log { display: flex; flex-direction: column; gap: 18px; }
.loghead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 8px; }
.grouphead { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.grouphead span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.shift { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 6px 0; }
.shift .range { font-variant-numeric: tabular-nums; font-weight: 700; }
.shift .dur { font-variant-numeric: tabular-nums; text-align: right; }
.shift .meta { color: var(--muted); font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
.shift .acts { display: flex; gap: 14px; justify-content: flex-end; align-items: start; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
.link.danger { color: var(--danger); }
.shift.live .range { color: var(--live); }
.confirm { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--bg); border-radius: 10px; padding: 8px 12px; }

.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 18px; color: var(--muted); }

/* Form */
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .row3 { grid-template-columns: 1fr 1fr; } .row3 .field:first-child { grid-column: 1 / -1; } }
.formacts { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 10px 18px; min-height: 44px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.err { color: var(--danger); font-size: 0.92rem; }
.hint { color: var(--muted); font-size: 0.9rem; }
.foot { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 12px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.install { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.install p { margin: 0; color: var(--muted); }

/* Tabs: only shown when someone has shared their hours with you */
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 10px 8px; font-weight: 700; color: var(--muted); min-height: 44px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Shared view header */
.sharedhead { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.sharedhead select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.readonly { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.readonly::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.rowline { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Sync & sharing card */
.sync { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.sync p { margin: 0; }
.sync .muted { color: var(--muted); }
.inline { display: flex; gap: 8px; flex-wrap: wrap; }
.inline input { flex: 1 1 200px; min-width: 0; }
.syncstate { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.syncstate .dot { background: var(--muted); }
.syncstate.ok .dot { background: var(--accent); }
.syncstate.wait .dot { background: var(--live); }
.syncstate.bad .dot { background: var(--danger); }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.people li { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--bg); border-radius: 10px; overflow-wrap: anywhere; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
.ok-msg { color: var(--accent); font-size: 0.92rem; }
input.code { font-family: var(--mono); letter-spacing: 0.3em; font-size: 1.3rem; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Care Hours</h1>
    <div class="today" id="today"></div>
  </header>

  <div class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" id="tabMine" aria-selected="true">My shifts</button>
    <button role="tab" id="tabShared" aria-selected="false">Shared with me</button>
  </div>

  <section class="sharedhead" id="sharedHead" hidden>
    <div class="rowline">
      <span class="label">Hours shared with you</span>
      <span class="readonly">View only</span>
    </div>
    <div class="field" id="ownerPickWrap">
      <label class="label" for="ownerPick">Caregiver</label>
      <select id="ownerPick"></select>
    </div>
    <div class="rowline">
      <span class="hint" id="sharedUpdated"></span>
      <button class="ghost" id="sharedRefresh">Refresh</button>
    </div>
  </section>

  <section class="clock" id="clock" aria-live="polite"></section>

  <section class="week" aria-label="Weekly hours">
    <div class="weekhead">
      <h2 id="weekTitle">This week</h2>
      <div class="nav">
        <button class="ghost" id="prevWeek" aria-label="Previous week">‹</button>
        <button class="ghost" id="thisWeek" hidden>Today</button>
        <button class="ghost" id="nextWeek" aria-label="Next week">›</button>
      </div>
    </div>
    <div class="total"><b class="num" id="weekTotal">0h</b><span id="weekDecimal">0.00 hours</span></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="log">
    <div class="loghead">
      <h2>Shifts</h2>
      <div class="tools">
        <button class="ghost" id="addBtn">+ Add a missed shift</button>
        <button class="ghost" id="csvBtn">Download week (CSV)</button>
      </div>
    </div>
    <div id="formSlot"></div>
    <div id="list"></div>
  </section>

  <section class="sync" id="sync" aria-live="polite" hidden></section>

  <aside class="install" id="installTip" hidden>
    <span class="label">Use it like an app</span>
    <p>On iPhone, tap the Share button in Safari, then <b>Add to Home Screen</b>. Care Hours then opens full screen from its own icon and keeps your shifts safe on this phone.</p>
  </aside>

  <p class="foot" id="foot">Loading your shifts…</p>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.3"></script>
<script>
(() => {
  // ================= state =================
  // Each shift: {id, start, end|null, person, note, updatedAt, deleted, dirty, failed?}
  //   start/end/updatedAt are milliseconds. "dirty" = changed here and not yet saved online.
  //   Deleted shifts are kept as markers (deleted: true) so other devices learn about the delete.
  let shifts = [];
  let view = "mine";           // "mine" | "shared"
  let weekOffset = 0;          // 0 = this week, -1 = last week
  let confirmId = null;
  let draftPerson = "";
  let draftNote = "";
  let noteForId = null;
  let formOpen = null;

  // online sync
  const CFG = window.CARE_HOURS_CONFIG || {};
  const configured = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
  let sb = null;               // Supabase client
  let libFailed = false;       // the Supabase library didn't load (usually offline)
  let me = null;               // {id, email}
  let sync = { state: "off", last: null, msg: "" };   // off | syncing | ok | wait | bad
  let signin = { step: "email", email: "", busy: false, err: "", info: "" };
  let shares = [];             // emails I share with
  let profile = { display_name: "" };
  let shareUi = { err: "", confirm: null, busy: false, savedName: false };
  let signoutConfirm = false;

  // people who shared with me
  let sharedOwners = [];       // [{owner, name, email}]
  let sharedOwner = null;      // owner uuid being viewed
  let sharedShifts = [];       // shifts of sharedOwner (read only)
  let sharedLoadedAt = null;
  let sharedErr = "";

  const LS_KEY = "care-hours-shifts-v1";
  const LS_OWNER = "care-hours-synced-owner";

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

  // ================= time helpers =================
  const HOUR = 3600000;
  function weekStart(d) {
    const x = new Date(d); x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // Monday
    return x;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function dur(ms) {
    const mins = Math.max(0, Math.round(ms / 60000));
    const h = Math.floor(mins / 60), m = mins % 60;
    return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
  }
  function clockText(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }
  const tFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
  const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "short", day: "numeric" });
  const shortFmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" });
  const wdFmt = new Intl.DateTimeFormat(undefined, { weekday: "short" });
  const pad = n => String(n).padStart(2, "0");
  const dateVal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const timeVal = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const endOf = s => s.end ?? Date.now();

  const mine = () => shifts.filter(s => !s.deleted);
  const active = () => mine().filter(s => !s.end).sort((a, b) => b.start - a.start)[0];
  const data = () => view === "shared" ? sharedShifts : mine();
  const readOnly = () => view === "shared";

  // ================= local storage =================
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(shifts)); } catch (e) {}
  }
  function loadLocal() {
    let v = [];
    try { v = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) {}
    if (!Array.isArray(v)) v = [];
    // Shifts saved by the first version of the app have no sync fields yet.
    return v.filter(s => s && s.id && typeof s.start === "number").map(s => ({
      id: String(s.id), start: s.start, end: s.end ?? null, person: s.person || "", note: s.note || "",
      updatedAt: s.updatedAt || s.end || s.start, deleted: !!s.deleted, dirty: s.dirty !== false, failed: !!s.failed,
    }));
  }
  function getLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setLS(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

  // Every change goes through here: save on this device first, then upload if signed in.
  function put(shift) {
    const rec = {
      id: shift.id, start: shift.start, end: shift.end ?? null, person: shift.person || "", note: shift.note || "",
      updatedAt: Math.max(Date.now(), (shift.updatedAt || 0) + 1), deleted: !!shift.deleted, dirty: true, failed: false,
    };
    const i = shifts.findIndex(s => s.id === shift.id);
    if (i >= 0) shifts[i] = rec; else shifts.push(rec);
    saveLocal(); renderAll(); push();
  }
  function remove(id) {
    const s = shifts.find(x => x.id === id);
    if (s) put({ ...s, deleted: true });
  }

  // ================= online sync =================
  const iso = ms => new Date(ms).toISOString();
  const toRow = s => ({
    owner: me.id, id: s.id, start_at: iso(s.start), end_at: s.end ? iso(s.end) : null,
    person: s.person, note: s.note, deleted: s.deleted, updated_at: iso(s.updatedAt),
  });
  const fromRow = r => ({
    id: r.id, start: Date.parse(r.start_at), end: r.end_at ? Date.parse(r.end_at) : null,
    person: r.person || "", note: r.note || "", updatedAt: Date.parse(r.updated_at), deleted: !!r.deleted, dirty: false, failed: false,
  });
  const isNetworkError = e => !e || !e.code || /fetch|network|load failed/i.test(e.message || "");

  async function fetchAll(build) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const { data: rows, error } = await build().range(from, from + 999);
      if (error) throw error;
      out.push(...rows);
      if (rows.length < 1000) return out;
    }
  }

  let pushing = false, pushAgain = false, retryTimer = null;
  async function push() {
    if (!sb || !me) return;
    if (pushing) { pushAgain = true; return; }
    pushing = true;
    try {
      do {
        pushAgain = false;
        const batch = shifts.filter(s => s.dirty && !s.failed);
        if (!batch.length) break;
        setSync("syncing");
        const sent = new Map(batch.map(s => [s.id, s.updatedAt]));
        let { error } = await sb.from("shifts").upsert(batch.map(toRow), { onConflict: "owner,id" });
        if (error && isNetworkError(error)) throw error;
        if (error) {
          // One bad shift shouldn't block the rest: try them one at a time.
          for (const s of batch) {
            const r = await sb.from("shifts").upsert([toRow(s)], { onConflict: "owner,id" });
            if (r.error && isNetworkError(r.error)) throw r.error;
            if (r.error) { const cur = shifts.find(x => x.id === s.id); if (cur && cur.updatedAt === s.updatedAt) cur.failed = true; sent.delete(s.id); }
          }
        }
        for (const [id, at] of sent) {
          const cur = shifts.find(s => s.id === id);
          if (cur && cur.updatedAt === at) cur.dirty = false;
        }
        saveLocal();
      } while (pushAgain);
      setSync(shifts.some(s => s.failed) ? "bad" : "ok", shifts.some(s => s.failed) ? "Some shifts couldn't be saved online. Edit them to try again." : "");
    } catch (e) {
      setSync("wait", "You're offline. Changes are saved on this device and will upload when you're back online.");
      clearTimeout(retryTimer); retryTimer = setTimeout(push, 30000);
    } finally {
      pushing = false;
      if (pushAgain) push();
    }
  }

  async function pull() {
    if (!sb || !me) return;
    try {
      setSync("syncing");
      const rows = await fetchAll(() => sb.from("shifts").select("*").eq("owner", me.id).order("id"));
      const byId = new Map(shifts.map(s => [s.id, s]));
      const seen = new Set();
      for (const r of rows) {
        const rem = fromRow(r); seen.add(rem.id);
        const loc = byId.get(rem.id);
        if (!loc || !loc.dirty || rem.updatedAt > loc.updatedAt) byId.set(rem.id, rem);
      }
      // A synced shift that isn't online any more belongs to another account; drop it.
      for (const [id, s] of byId) if (!seen.has(id) && !s.dirty) byId.delete(id);
      shifts = [...byId.values()];
      setLS(LS_OWNER, me.id);
      saveLocal(); renderAll();
      sync.last = Date.now();
      await push();
      if (!shifts.some(s => s.dirty)) setSync("ok");
    } catch (e) {
      setSync("wait", "Can't reach the online database right now. Your shifts are safe on this device.");
    }
  }

  function setSync(state, msg = "") { sync.state = state; sync.msg = msg; if (state === "ok") sync.last = Date.now(); renderSyncState(); }

  async function loadShares() {
    if (!sb || !me) return;
    const [s, p] = await Promise.all([
      sb.from("shares").select("viewer_email").eq("owner", me.id).order("created_at"),
      sb.from("profiles").select("display_name, email").eq("id", me.id).maybeSingle(),
    ]);
    if (!s.error) shares = s.data.map(r => r.viewer_email);
    if (!p.error) profile = p.data || { display_name: "", email: "" };
    renderSync();
    return !p.error;
  }

  async function loadSharedWithMe() {
    if (!sb || !me) return;
    const { data: rows, error } = await sb.from("shares").select("owner").eq("viewer_email", (me.email || "").toLowerCase()).neq("owner", me.id);
    if (error) return;
    const ids = [...new Set(rows.map(r => r.owner))];
    let names = {};
    if (ids.length) {
      const pr = await sb.from("profiles").select("id, display_name, email").in("id", ids);
      if (!pr.error) for (const p of pr.data) names[p.id] = p;
    }
    sharedOwners = ids.map(id => ({ owner: id, name: (names[id] && names[id].display_name) || (names[id] && names[id].email) || "A caregiver", email: (names[id] && names[id].email) || "" }))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!sharedOwners.some(o => o.owner === sharedOwner)) sharedOwner = sharedOwners[0] ? sharedOwners[0].owner : null;
    // Someone who only views shared hours lands on that view.
    if (sharedOwners.length && !mine().length && view === "mine") view = "shared";
    if (!sharedOwners.length) view = "mine";
    await loadSharedShifts();
    renderAll();
  }

  async function loadSharedShifts() {
    sharedErr = "";
    if (!sb || !sharedOwner) { sharedShifts = []; return; }
    try {
      const rows = await fetchAll(() => sb.from("shifts").select("*").eq("owner", sharedOwner).eq("deleted", false).order("id"));
      sharedShifts = rows.map(fromRow);
      sharedLoadedAt = Date.now();
    } catch (e) {
      sharedErr = "Couldn't load the latest hours. Check your connection and tap Refresh.";
    }
  }

  async function onSignedIn(session) {
    const u = session.user;
    if (me && me.id === u.id) return;
    me = { id: u.id, email: u.email || "" };
    signin = { step: "email", email: "", busy: false, err: "", info: "" };
    renderSync();
    // Make sure people you share with see a name, defaulting to your email.
    await pull();
    const profileLoaded = await loadShares();
    if (profileLoaded && profile.email !== me.email) {
      await sb.from("profiles").upsert({ id: me.id, email: me.email, display_name: profile.display_name || "" });
    }
    await loadSharedWithMe();
  }
  function onSignedOut() {
    me = null; shares = []; profile = { display_name: "" }; sharedOwners = []; sharedShifts = []; sharedOwner = null; view = "mine";
    setSync("off"); renderAll();
  }

  function initSync() {
    if (!configured) return;
    if (!window.supabase || !window.supabase.createClient) {
      libFailed = true;
      $("sync").hidden = false;
      $("sync").innerHTML = `<h2>Online sync</h2><p class="muted">Online sync couldn't load. Check your internet connection and reopen Care Hours. Your shifts are still saved on this device.</p>`;
      return;
    }
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "care-hours-auth" },
    });
    sb.auth.onAuthStateChange((event, session) => {
      // Run outside the auth callback so Supabase calls inside it don't wait on each other.
      setTimeout(() => { if (session && session.user) onSignedIn(session); else if (event === "SIGNED_OUT") onSignedOut(); }, 0);
    });
    renderSync();
    window.addEventListener("online", () => { pull(); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && me) { pull(); if (view === "shared") refreshShared(); }
    });
  }
  async function refreshShared() { await loadSharedShifts(); renderAll(); }

  // ================= render: tabs & shared header =================
  function renderTabs() {
    const show = !!me && sharedOwners.length > 0;
    $("tabs").hidden = !show;
    $("tabMine").setAttribute("aria-selected", String(view === "mine"));
    $("tabShared").setAttribute("aria-selected", String(view === "shared"));
    const sh = view === "shared";
    $("sharedHead").hidden = !sh;
    $("clock").hidden = sh;
    $("addBtn").hidden = sh;
    if (sh) {
      $("ownerPickWrap").hidden = sharedOwners.length < 2;
      $("ownerPick").innerHTML = sharedOwners.map(o => `<option value="${esc(o.owner)}"${o.owner === sharedOwner ? " selected" : ""}>${esc(o.name)}</option>`).join("");
      const o = sharedOwners.find(o => o.owner === sharedOwner);
      $("sharedUpdated").textContent = sharedErr || (o ? `${o.name}${sharedOwners.length < 2 && o.email && o.email !== o.name ? " · " + o.email : ""}${sharedLoadedAt ? " · updated " + tFmt.format(new Date(sharedLoadedAt)) : ""}` : "");
    }
  }
  $("tabMine").addEventListener("click", () => { view = "mine"; weekOffset = 0; closeForm(); renderAll(); });
  $("tabShared").addEventListener("click", () => { view = "shared"; weekOffset = 0; closeForm(); renderAll(); refreshShared(); });
  $("ownerPick").addEventListener("change", async e => { sharedOwner = e.target.value; sharedShifts = []; renderAll(); await refreshShared(); });
  $("sharedRefresh").addEventListener("click", refreshShared);

  // ================= render: clock =================
  function renderClock() {
    const a = active();
    const el = $("clock");
    el.classList.toggle("on", !!a);
    if (a) {
      if (noteForId !== a.id) { noteForId = a.id; draftNote = a.note || ""; }
      el.innerHTML = `
        <div class="status"><span class="dot"></span>On the clock${a.person ? ` · caring for ${esc(a.person)}` : ""}</div>
        <div><div class="timer" id="timer">${clockText(Date.now() - a.start)}</div>
        <div class="since">Started at ${tFmt.format(new Date(a.start))}${sameDay(new Date(a.start), new Date()) ? "" : ", " + shortFmt.format(new Date(a.start))}</div></div>
        <div class="field"><label class="label" for="noteIn">Notes for this shift</label>
          <textarea id="noteIn" placeholder="Meals, medications given, errands, anything to remember">${esc(draftNote)}</textarea></div>
        <button class="big out" id="clockBtn">Clock out</button>`;
      $("noteIn").addEventListener("input", e => { draftNote = e.target.value; });
      // Save the note without redrawing the card, so a tap on Clock out isn't swallowed.
      $("noteIn").addEventListener("blur", () => {
        const cur = active();
        if (!cur || draftNote === (cur.note || "")) return;
        cur.note = draftNote; cur.updatedAt = Date.now(); cur.dirty = true; cur.failed = false;
        saveLocal(); renderList();
        setTimeout(push, 800);
      });
    } else {
      noteForId = null;
      const people = [...new Set(mine().map(s => s.person).filter(Boolean))];
      el.innerHTML = `
        <div class="status"><span class="dot"></span>Off the clock</div>
        <div class="field"><label class="label" for="personIn">Caring for</label>
          <input id="personIn" list="people" autocomplete="off" placeholder="Name (optional)" value="${esc(draftPerson)}">
          <datalist id="people">${people.map(p => `<option value="${esc(p)}"></option>`).join("")}</datalist></div>
        <button class="big" id="clockBtn">Clock in</button>`;
      $("personIn").addEventListener("input", e => { draftPerson = e.target.value; });
    }
    $("clockBtn").addEventListener("click", onClock);
  }
  function onClock() {
    const a = active();
    if (a) {
      draftPerson = a.person || "";
      put({ ...a, end: Math.max(Date.now(), a.start), note: draftNote });
    } else {
      weekOffset = 0;
      put({ id: newId(), start: Date.now(), end: null, person: draftPerson.trim(), note: "" });
    }
  }

  // ================= render: week =================
  function viewWeek() { return addDays(weekStart(new Date()), weekOffset * 7); }
  function msInDay(dayStart) {
    const dayEnd = addDays(dayStart, 1).getTime(), ds = dayStart.getTime();
    // Each shift counts on the day it started.
    return data().filter(s => s.start >= ds && s.start < dayEnd).reduce((t, s) => t + (endOf(s) - s.start), 0);
  }
  function renderWeek() {
    const ws = viewWeek(), today = new Date();
    const days = [...Array(7)].map((_, i) => addDays(ws, i));
    const totals = days.map(msInDay);
    const total = totals.reduce((a, b) => a + b, 0);
    $("weekTitle").textContent = weekOffset === 0 ? "This week" : weekOffset === -1 ? "Last week" : `Week of ${shortFmt.format(ws)}`;
    $("thisWeek").hidden = weekOffset === 0;
    $("nextWeek").disabled = weekOffset >= 0;
    $("nextWeek").style.visibility = weekOffset >= 0 ? "hidden" : "visible";
    $("weekTotal").textContent = total ? dur(total) : "0h";
    $("weekDecimal").textContent = `${(total / HOUR).toFixed(2)} hours · ${shortFmt.format(ws)}–${shortFmt.format(days[6])}`;
    const max = Math.max(8 * HOUR, ...totals);
    $("bars").innerHTML = days.map((d, i) => {
      const pct = totals[i] ? Math.max(4, (totals[i] / max) * 100) : 0;
      return `<div class="day${sameDay(d, today) ? " is-today" : ""}">
        <div class="track" title="${dur(totals[i])}"><div class="fill" style="height:${pct}%"></div></div>
        <div class="dname">${wdFmt.format(d)}</div>
        <div class="dhrs">${totals[i] ? (totals[i] / HOUR).toFixed(1) : "–"}</div></div>`;
    }).join("");
  }

  // ================= render: list =================
  function renderList() {
    const ws = viewWeek().getTime(), we = addDays(viewWeek(), 7).getTime();
    const inWeek = data().filter(s => s.start >= ws && s.start < we).sort((a, b) => b.start - a.start);
    const list = $("list");
    if (!inWeek.length) {
      list.innerHTML = `<div class="empty">${readOnly()
        ? (sharedErr ? esc(sharedErr) : "No shifts recorded this week.")
        : weekOffset === 0
          ? "No shifts yet this week. Tap <b>Clock in</b> when you start, or add a shift you forgot to record."
          : "No shifts recorded this week."}</div>`;
      return;
    }
    const groups = new Map();
    for (const s of inWeek) {
      const k = dateVal(new Date(s.start));
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(s);
    }
    list.innerHTML = `<div class="log">${[...groups.values()].map(g => {
      const d = new Date(g[0].start);
      const t = g.reduce((a, s) => a + (endOf(s) - s.start), 0);
      return `<div class="group">
        <div class="grouphead"><span class="label">${dayFmt.format(d)}</span><span>${dur(t)}</span></div>
        ${g.map(shiftRow).join("")}</div>`;
    }).join("")}</div>`;
  }
  function shiftRow(s) {
    const st = new Date(s.start), live = !s.end;
    const en = live ? null : new Date(s.end);
    const range = `${tFmt.format(st)} – ${live ? "now" : tFmt.format(en)}${en && !sameDay(st, en) ? " (next day)" : ""}`;
    const meta = [s.person && `Caring for ${esc(s.person)}`, s.note && esc(s.note), s.failed && "Not saved online"].filter(Boolean).join(" · ");
    const confirm = confirmId === s.id ? `<div class="confirm"><span>Delete this shift?</span>
      <button class="link danger" data-act="del-yes" data-id="${esc(s.id)}">Delete</button>
      <button class="link" data-act="del-no">Keep it</button></div>` : "";
    const acts = live || readOnly() ? "" : `<button class="link" data-act="edit" data-id="${esc(s.id)}">Edit</button>
        <button class="link danger" data-act="del" data-id="${esc(s.id)}">Delete</button>`;
    return `<div class="shift${live ? " live" : ""}">
      <div class="range">${range}</div><div class="dur" ${live ? 'data-live="1"' : ""}>${dur(endOf(s) - s.start)}</div>
      <div class="meta">${meta}</div>
      <div class="acts">${acts}</div>
      ${confirm}</div>`;
  }
  $("list").addEventListener("click", e => {
    const b = e.target.closest("button[data-act]"); if (!b || readOnly()) return;
    const id = b.dataset.id;
    if (b.dataset.act === "del") { confirmId = id; renderList(); }
    else if (b.dataset.act === "del-no") { confirmId = null; renderList(); }
    else if (b.dataset.act === "del-yes") { confirmId = null; remove(id); }
    else if (b.dataset.act === "edit") openForm(mine().find(s => s.id === id));
  });

  // ================= add / edit form =================
  function openForm(s) {
    const now = new Date();
    const st = s ? new Date(s.start) : new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0);
    const en = s ? new Date(s.end) : new Date(now.getFullYear(), now.getMonth(), now.getDate(), 13, 0);
    formOpen = { id: s ? s.id : null, prev: s || null };
    $("formSlot").innerHTML = `
      <form class="form" id="shiftForm" novalidate>
        <h2>${s ? "Edit shift" : "Add a missed shift"}</h2>
        <div class="row3">
          <div class="field"><label class="label" for="fDate">Date</label><input type="date" id="fDate" value="${dateVal(st)}" required></div>
          <div class="field"><label class="label" for="fStart">Start</label><input type="time" id="fStart" value="${timeVal(st)}" required></div>
          <div class="field"><label class="label" for="fEnd">End</label><input type="time" id="fEnd" value="${timeVal(en)}" required></div>
        </div>
        <div class="hint" id="fHint"></div>
        <div class="field"><label class="label" for="fPerson">Caring for</label><input id="fPerson" list="people" value="${esc(s ? s.person : draftPerson)}" placeholder="Name (optional)"></div>
        <div class="field"><label class="label" for="fNote">Notes</label><textarea id="fNote">${esc(s ? s.note : "")}</textarea></div>
        <div class="err" id="fErr" role="alert"></div>
        <div class="formacts"><button class="btn" type="submit">${s ? "Save changes" : "Add shift"}</button>
          <button class="ghost" type="button" id="fCancel">Cancel</button></div>
      </form>`;
    const f = $("shiftForm");
    const update = () => {
      const r = readTimes();
      $("fHint").textContent = r && r.overnight ? `Ends the next day · ${dur(r.end - r.start)}` : r ? dur(r.end - r.start) : "";
    };
    ["fDate", "fStart", "fEnd"].forEach(id => $(id).addEventListener("input", update));
    update();
    $("fCancel").addEventListener("click", closeForm);
    f.addEventListener("submit", ev => {
      ev.preventDefault();
      const r = readTimes();
      if (!r) { $("fErr").textContent = "Enter a date, a start time and an end time."; return; }
      if (r.end - r.start > 24 * HOUR) { $("fErr").textContent = "A shift can't be longer than 24 hours."; return; }
      if (r.end > Date.now() + 60000) { $("fErr").textContent = "That shift ends in the future. Use Clock in for a shift that's happening now."; return; }
      const prev = formOpen.prev;
      put({ id: formOpen.id || newId(), start: r.start, end: r.end, person: $("fPerson").value.trim(), note: $("fNote").value.trim(), updatedAt: prev ? prev.updatedAt : 0 });
      weekOffset = Math.round((weekStart(new Date(r.start)) - weekStart(new Date())) / (7 * 24 * HOUR));
      closeForm(); renderAll();
    });
    $("fDate").focus();
  }
  function readTimes() {
    const d = $("fDate").value, a = $("fStart").value, b = $("fEnd").value;
    if (!d || !a || !b) return null;
    const start = new Date(`${d}T${a}`).getTime();
    let end = new Date(`${d}T${b}`).getTime();
    if (isNaN(start) || isNaN(end)) return null;
    let overnight = false;
    if (end <= start) { end = addDays(new Date(end), 1).getTime(); overnight = true; }
    return { start, end, overnight };
  }
  function closeForm() { formOpen = null; $("formSlot").innerHTML = ""; }
  $("addBtn").addEventListener("click", () => openForm(null));

  // ================= week navigation =================
  $("prevWeek").addEventListener("click", () => { weekOffset--; confirmId = null; renderWeek(); renderList(); });
  $("nextWeek").addEventListener("click", () => { if (weekOffset < 0) { weekOffset++; confirmId = null; renderWeek(); renderList(); } });
  $("thisWeek").addEventListener("click", () => { weekOffset = 0; renderWeek(); renderList(); });

  // ================= CSV export of the week on screen =================
  function csvCell(v) { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
  $("csvBtn").addEventListener("click", () => {
    const ws = viewWeek(), we = addDays(ws, 7).getTime();
    const rows = data().filter(s => s.end && s.start >= ws.getTime() && s.start < we).sort((a, b) => a.start - b.start);
    const lines = [["Date", "Start", "End", "Hours", "Caring for", "Notes"]];
    let total = 0;
    for (const s of rows) {
      const h = (s.end - s.start) / HOUR; total += h;
      lines.push([dateVal(new Date(s.start)), tFmt.format(new Date(s.start)), tFmt.format(new Date(s.end)), h.toFixed(2), s.person, s.note]);
    }
    lines.push(["Total", "", "", total.toFixed(2), "", ""]);
    const csv = lines.map(r => r.map(csvCell).join(",")).join("\r\n");
    const who = view === "shared" ? ((sharedOwners.find(o => o.owner === sharedOwner) || {}).name || "caregiver") : "";
    const slug = who ? who.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" : "";
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `care-hours-${slug}week-of-${dateVal(ws)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });

  // ================= render: sync & sharing card =================
  function syncLine() {
    const pending = shifts.filter(s => s.dirty && !s.failed).length;
    if (sync.state === "syncing") return { cls: "wait", text: "Syncing…" };
    if (sync.state === "bad") return { cls: "bad", text: sync.msg };
    if (sync.state === "wait") return { cls: "wait", text: sync.msg + (pending ? ` (${pending} waiting)` : "") };
    if (pending) return { cls: "wait", text: `${pending} change${pending === 1 ? "" : "s"} waiting to upload` };
    return { cls: "ok", text: `All shifts saved online${sync.last ? " · " + tFmt.format(new Date(sync.last)) : ""}` };
  }
  function renderSyncState() {
    const el = $("syncState"); if (!el) { renderFoot(); return; }
    const l = syncLine();
    el.className = "syncstate " + l.cls;
    el.innerHTML = `<span class="dot"></span><span>${esc(l.text)}</span>`;
    renderFoot();
  }
  function renderFoot() {
    $("foot").textContent = view === "shared"
      ? "You're viewing hours someone shared with you. Only they can change them, and they can stop sharing at any time."
      : me
      ? "Your shifts are saved on this device and in your online account. Only you and the people you share with can see them."
      : "Your shifts are saved on this device only. Nobody else can see them. Download a CSV now and then to keep a backup.";
  }

  function renderSync() {
    const el = $("sync");
    if (libFailed) { el.hidden = view === "shared"; renderFoot(); return; }
    if (!configured || !sb || (view === "shared" && me)) { el.hidden = true; renderFoot(); return; }
    el.hidden = false;
    const focusId = document.activeElement && el.contains(document.activeElement) ? document.activeElement.id : null;

    if (!me) {
      if (signin.step === "email") {
        el.innerHTML = `
          <h2>Back up, sync and share</h2>
          <p class="muted">Sign in with your email to save your shifts online, use them on more than one device, and let the people who pay you see your hours.</p>
          <form id="emailForm" class="field" novalidate>
            <label class="label" for="siEmail">Email</label>
            <div class="inline"><input id="siEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="${esc(signin.email)}">
            <button class="btn" type="submit" ${signin.busy ? "disabled" : ""}>${signin.busy ? "Sending…" : "Email me a code"}</button></div>
          </form>
          <div class="err" role="alert">${esc(signin.err)}</div>
          <p class="hint">No password needed. Already have someone's hours shared with you? Sign in with the email they shared with.</p>`;
        $("emailForm").addEventListener("submit", sendCode);
      } else {
        el.innerHTML = `
          <h2>Check your email</h2>
          <p class="muted">We sent a sign-in code to <b>${esc(signin.email)}</b>. Enter it here. It can take a minute to arrive, so check your spam folder too.</p>
          <form id="codeForm" class="field" novalidate>
            <label class="label" for="siCode">Code</label>
            <div class="inline"><input id="siCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456">
            <button class="btn" type="submit" ${signin.busy ? "disabled" : ""}>${signin.busy ? "Checking…" : "Sign in"}</button></div>
          </form>
          <div class="err" role="alert">${esc(signin.err)}</div>
          <div class="ok-msg">${esc(signin.info)}</div>
          <div class="inline"><button class="link" id="resend">Send a new code</button><button class="link" id="changeEmail">Use a different email</button></div>`;
        $("codeForm").addEventListener("submit", verifyCode);
        $("resend").addEventListener("click", e => { e.preventDefault(); sendCode(null, true); });
        $("changeEmail").addEventListener("click", e => { e.preventDefault(); signin = { step: "email", email: signin.email, busy: false, err: "", info: "" }; renderSync(); });
      }
    } else {
      const unsynced = shifts.filter(s => s.dirty).length;
      el.innerHTML = `
        <div class="rowline"><h2>Sync &amp; sharing</h2><button class="link" id="signOut">Sign out</button></div>
        ${signoutConfirm ? `<div class="confirm"><span>${unsynced
          ? `${unsynced} change${unsynced === 1 ? " hasn't" : "s haven't"} uploaded yet and will be lost if you sign out now.`
          : "Signing out removes your shifts from this device. They stay safe in your online account."}</span>
          <button class="link danger" id="signOutYes">Sign out</button><button class="link" id="signOutNo">Stay signed in</button></div>` : ""}
        <p class="muted">Signed in as <b>${esc(me.email)}</b></p>
        <div class="syncstate" id="syncState"></div>
        <hr class="divider">
        <form id="nameForm" class="field" novalidate>
          <label class="label" for="dispName">Your name, as the people you share with see it</label>
          <div class="inline"><input id="dispName" autocomplete="name" placeholder="${esc(me.email)}" value="${esc(profile.display_name)}">
          <button class="ghost" type="submit">Save name</button></div>
          <div class="ok-msg">${shareUi.savedName ? "Name saved." : ""}</div>
        </form>
        <div class="field">
          <span class="label">People who can see your hours</span>
          ${shares.length ? `<ul class="people">${shares.map(e => `<li><span>${esc(e)}</span>${shareUi.confirm === e
            ? `<span class="inline"><button class="link danger" data-unshare-yes="${esc(e)}">Stop sharing</button><button class="link" data-unshare-no="1">Cancel</button></span>`
            : `<button class="link danger" data-unshare="${esc(e)}">Remove</button>`}</li>`).join("")}</ul>`
            : `<p class="hint">Nobody yet. Add the email of someone who pays you.</p>`}
        </div>
        <form id="shareForm" class="field" novalidate>
          <label class="label" for="shareEmail">Share your hours with</label>
          <div class="inline"><input id="shareEmail" type="email" inputmode="email" placeholder="payer@example.com">
          <button class="btn" type="submit" ${shareUi.busy ? "disabled" : ""}>Share</button></div>
          <div class="err" role="alert">${esc(shareUi.err)}</div>
          <p class="hint">They open Care Hours and sign in with that email to see your shifts, including your notes. They can't change anything. You can remove them any time.</p>
        </form>`;
      renderSyncState();
      $("signOut").addEventListener("click", () => { signoutConfirm = true; renderSync(); });
      if (signoutConfirm) {
        $("signOutNo").addEventListener("click", () => { signoutConfirm = false; renderSync(); });
        $("signOutYes").addEventListener("click", signOut);
      }
      $("nameForm").addEventListener("submit", saveName);
      $("shareForm").addEventListener("submit", addShare);
      el.querySelectorAll("[data-unshare]").forEach(b => b.addEventListener("click", () => { shareUi.confirm = b.dataset.unshare; renderSync(); }));
      el.querySelectorAll("[data-unshare-no]").forEach(b => b.addEventListener("click", () => { shareUi.confirm = null; renderSync(); }));
      el.querySelectorAll("[data-unshare-yes]").forEach(b => b.addEventListener("click", () => removeShare(b.dataset.unshareYes)));
    }
    if (focusId && $(focusId)) $(focusId).focus();
    renderFoot();
  }

  const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  async function sendCode(ev, resend) {
    if (ev) ev.preventDefault();
    const email = resend ? signin.email : ($("siEmail").value || "").trim().toLowerCase();
    if (!emailOk(email)) { signin.err = "Enter your full email address, like name@example.com."; signin.email = email; renderSync(); return; }
    signin = { ...signin, email, busy: true, err: "", info: "" }; renderSync();
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
    signin.busy = false;
    if (error) {
      signin.err = /rate|too many|seconds/i.test(error.message) ? "Too many codes requested. Wait a minute, then try again."
        : /not authorized/i.test(error.message) ? "This app can't email that address yet. Ask the person who set up Care Hours to finish the email setup."
        : "The code couldn't be sent. Check the address and your connection, then try again.";
      renderSync(); return;
    }
    signin.step = "code"; signin.info = resend ? "A new code is on its way." : "";
    renderSync();
    const c = $("siCode"); if (c) c.focus();
  }
  async function verifyCode(ev) {
    ev.preventDefault();
    const token = ($("siCode").value || "").replace(/\D/g, "");
    if (token.length < 6) { signin.err = "Enter the code from the email. It's at least 6 digits."; renderSync(); return; }
    signin = { ...signin, busy: true, err: "", info: "" }; renderSync();
    let { error } = await sb.auth.verifyOtp({ email: signin.email, token, type: "email" });
    if (error) { const r2 = await sb.auth.verifyOtp({ email: signin.email, token, type: "signup" }); if (!r2.error) error = null; }
    signin.busy = false;
    if (error) { signin.err = "That code didn't work. It may have expired or been mistyped. Check it, or send a new code."; renderSync(); }
    // On success, onAuthStateChange takes over.
  }
  async function signOut() {
    signoutConfirm = false;
    await sb.auth.signOut().catch(() => {});
    // The shifts stay safe in the online account; remove them from this device.
    shifts = [];
    setLS(LS_OWNER, null); saveLocal();
    onSignedOut();
    renderSync();
  }
  async function saveName(ev) {
    ev.preventDefault();
    const name = ($("dispName").value || "").trim().slice(0, 100);
    const { error } = await sb.from("profiles").upsert({ id: me.id, email: me.email, display_name: name });
    if (!error) { profile.display_name = name; shareUi.savedName = true; renderSync(); setTimeout(() => { shareUi.savedName = false; renderSync(); }, 2500); }
  }
  async function addShare(ev) {
    ev.preventDefault();
    const email = ($("shareEmail").value || "").trim().toLowerCase();
    shareUi.err = "";
    if (!emailOk(email)) { shareUi.err = "Enter their full email address, like name@example.com."; renderSync(); return; }
    if (email === (me.email || "").toLowerCase()) { shareUi.err = "That's your own email. Enter the email of the person who pays you."; renderSync(); return; }
    if (shares.includes(email)) { shareUi.err = `You already share with ${email}.`; renderSync(); return; }
    shareUi.busy = true; renderSync();
    const { error } = await sb.from("shares").insert({ owner: me.id, viewer_email: email });
    shareUi.busy = false;
    if (error) { shareUi.err = "Sharing didn't save. Check your connection and try again."; renderSync(); return; }
    shares.push(email); renderSync();
  }
  async function removeShare(email) {
    const { error } = await sb.from("shares").delete().eq("owner", me.id).eq("viewer_email", email);
    shareUi.confirm = null;
    if (error) shareUi.err = "That person wasn't removed. Check your connection and try again.";
    else shares = shares.filter(e => e !== email);
    renderSync();
  }

  // ================= top-level render =================
  function renderAll() {
    $("today").textContent = dayFmt.format(new Date());
    renderTabs();
    if (view === "mine") {
      // Keep the clock card intact while someone is typing in it.
      const typing = document.activeElement && $("clock").contains(document.activeElement) && document.activeElement.tagName !== "BUTTON";
      if (!typing || !!active() !== $("clock").classList.contains("on")) renderClock();
    }
    renderWeek(); renderList();
    const typingSync = document.activeElement && $("sync").contains(document.activeElement) && document.activeElement.tagName === "INPUT";
    if (!typingSync) renderSync(); else renderSyncState();
  }

  // Live timer: update text every second; refresh totals every 30 seconds.
  let ticks = 0;
  setInterval(() => {
    const a = active();
    if (a && view === "mine") { const t = $("timer"); if (t) t.textContent = clockText(Date.now() - a.start); }
    if (++ticks % 30 === 0 && data().some(s => !s.end)) { renderWeek(); renderList(); }
  }, 1000);

  // ================= start =================
  shifts = loadLocal();
  const standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  $("installTip").hidden = standalone;
  renderAll();
  initSync();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
